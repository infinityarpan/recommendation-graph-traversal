services:
  neo4j:
    image: neo4j:5.26
    container_name: recommendation-graph-traversal-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1;' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
    container_name: recommendation-graph-traversal-api
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      LOG_LEVEL: INFO
    command: >
      sh -c "python scripts/seed_graph.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"

volumes:
  neo4j_data:
  neo4j_logs:
